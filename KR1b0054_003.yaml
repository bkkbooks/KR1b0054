body:
  text: 洪範正論卷三德清胡渭撰三八政一曰食二曰貨三曰祀四曰司空五曰司徒六曰司寇七曰賓八曰師正義曰此用於民緩急而為次也食貨祀賔師指事為之名三卿舉官為名者三官所主事多若以一字為名則所掌不盡故舉官名以見義貨者金玉布帛之總名林氏曰一曰食者務農重穀之政也如井田補助之類是也二曰貨者阜通貨財之政也如懋遷有無化居之類是也三曰祀者報本反始之政也社稷宗廟山川百神以至公卿大夫士庶莫不祭其先之類是也四曰司空者度土居民之政也如辨方正位體國經野使士農工商各得其所之類是也五曰司徒者教民之政也如學校選舉之類是也六曰司寇者立法懲奸之政也如五刑之屬是也七曰賓者交際酬酢之政也如冠昏喪祭鄉飲相見之類是也八曰師者寓兵於農以修武備之政如鄉遂教閲之法是也陳氏師凱曰八政皆為民而設王氏樵曰八政唐虞則屬之九官成周則謂之六典而在禹則謂之六府三事者也農者厚也聖人養民之心有加而無己九功惟叙九叙惟歌戒之用休董之用威勸之以九歌俾勿壞此農用八政之道也蘇氏曰周禮建六官主八政食貨則天官祀賔則春官師則夏官司空則冬官司徒則地官司寇則秋官朱子曰此八政是箇大綱天下之事其大者已該備於此如周禮一書只是箇八政而已然虞夏之制與周禮不同先儒謂六官自古有之堯設天地四時之官羲和掌天地仲叔分主四時堯典乃命羲和注云天官稷也稷田正地官司徒也分命仲叔注云春為秩宗夏為司馬秋為士冬為共工通稷與司徒是六官之名也見周禮疏至夏則始名六卿甘誓乃召六卿是也鄭康成注尚書大𫝊云夏六卿者后稷司徒秩宗司馬作士共工也鄭又云秩宗舜時官也初堯冬官為共工舜舉禹治水改名司空以命之後復為共工與虞堯初天官為稷至試舜謂之百揆舜又命禹為之此段亦見周禮疏殷六卿則曲禮疏云大宰司徒司馬司空司士司寇也周之六卿見周禮曰天官冢宰地官司徒春官宗伯夏官司馬秋官司寇冬官司空虞夏之制不可得詳必準之以周官而後其政可得而言焉司空堯官僉曰伯禹作司空是也劉向說苑云堯之時舜為司徒契為司馬禹為司空文子淮南子並同舜命九官分司空之職為二命垂共工益作朕虞不知何時又合為司空馬融注書序云咎單為湯司空疑亦因於夏蓋此八政之名禹敘洛書後所定乃登王位遂以為一代之制故此稱司空司空與司徒司寇皆夏官名也今按司空之職不止於度地居民書周官曰司空掌邦土居四民凡平水土治溝洫修道塗利器用營城郭宫室皆其職也是皆切於民政者一居字不足以盡之故特舉其官崔靈恩曰堯置天地四時之官舜改地官曰司徒秋官為士冬官為司空春官為秩宗見杜氏通典今按舜命契曰汝作司徒孟子亦云舜使契為司徒是司徒實虞官也司徒之職亦不止敷五教王制曰司徒修六禮以節民性明七教以興民德齊八政以防淫一道德以同俗養耆老以致孝恤孤獨以逮不足上賢以崇德簡不肖以絀惡其所主事多一教字不足以盡之故亦特舉其官舜命臯陶作士不知何時改為司寇疑亦是夏制鄭言夏之六卿秋官仍名士恐非司寇之職不止於刑獄如詰姦慝平暴亂皆其職也一刑字不足以盡之故亦特舉其官六官而獨舉其三疏義甚確蓋官所主事多而皆切於民政一字不足以盡之則舉其官司空司徒司寇是也官所主事多而切於民政者惟一二則指言其事天官之食貨秩宗之祀賓司馬之師是也諸儒說此條司空主民居司徒主教司寇主刑則經以一字盡之曰居曰教曰刑可矣何必變例稱官邪林解亦未免此失當分别觀之陳壽翁云八政在唐虞時食貨合為一而稷掌之粒蒸民而遷有無是也此本周禮賈疏稷為天官之說夫稷田正也而謂之天官殊未可曉然吾觀禹曰豫暨稷播奏庶艱食鮮食懋遷有無化居日知録云化者貨也古化貨二字多通用然則化即是貨棄為后稷既播穀又懋遷食貨二者皆其所掌無疑也王制冢宰以三十年之通制國用量入以為出而周禮冢宰之屬又有大府內府外府職幣典絲典枲等職蓋自古食貨之事皆掌於天官堯試舜名天官稷曰百揆舜亦以命禹百揆者度百事也其職最為繁重而其切於民政者莫如食貨故特舉二事而不稱其官漢書食貨志曰洪範八政一曰食二曰貨食謂農殖嘉穀可食之物貨謂布帛可衣及金刀龜貝所以分財布利通有無者也二者生民之本是為政首禹貢荆揚貢金三品𫝊曰金銀銅也史記平準書虞夏之幣金為三等或黃或白或赤珠玉為器飾寶藏而不為貨然則八政之所謂貨者亦惟布帛與金錢龜貝耳舜典修五禮𫝊云吉凶賔軍嘉之禮疏云古今之禮或殊而以周之五禮為此五禮者以帝王相承事有損益後代之禮亦當是前代禮也且歷驗此經亦有五事此篇類于上帝吉也如喪考妣凶也羣后四朝賓也大禹謨云汝徂征軍也堯典云女于時嘉也五禮之事並見於經知與後世不異也然則虞夏時固有五禮矣祀於五禮屬吉祭先祖曰祠禴蒸嘗祭外神曰置社大夫以下成羣立社曰置社五祀户竈中霤門行八蠟先嗇司嗇農郵表畷貓虎坊水庸皆報本反始人治之大者故食貨之後即繼以祀賓則兼五禮而言如儀禮十七篇所載冠昏喪祭鄉飲射士相見之類皆有賓主以成其禮是也正義云民不往來則無相親之好故賓為七說賓字甚當蔡𫝊云禮諸侯逺人此乃朝廷之禮非所以厚民也宗伯所掌自五禮而外尚有樂律天文寶器車服史巫卜筮之屬皆統於其職然惟祀賔為切於民政故特舉二事而不稱其官郯子言其祖少皥氏以鳥名官曰鴡鳩氏司馬也是上世已有司馬之官矣唐虞時天官曰稷地官司徒春官秩宗秋官士冬官司空或曰共工唯無夏官之名說苑云堯時契為司馬禮記疏引鄭康成云祝融為堯司馬皆不見於經𫝊未可據信舜命臯陶作士曰蠻夷猾夏寇賊姦宄故蔡𫝊謂此以士官兼兵刑之事周禮分為夏秋兩官是虞亦無司馬也伏生夏𫝊云司馬在前𦙍征𫝊云仲康命𦙍侯掌王六師為大司馬杜氏通典云卨𤣥孫之子微為夏司馬則司馬乃夏后氏之官兵刑分職不自周始矣今準周禮言之司馬掌九伐之法及九州之險固五兵之械器牧圉之馬政王制又言司馬辨論官材而定其爵祿是司馬之職甚多而唯四時講武最切於民政故特舉一事曰師而不稱其官使夏不分兵刑為二官則師已具在司寇中不得别為一政矣此理甚明古者寓兵於農處則為比閭族黨州鄉行則為伍兩卒旅師軍春搜夏苗秋獮冬狩皆於農隙講武事以習坐作進退步伐擊刺之法而後可以禦寇盜備非常故八政以師終焉箕子演疇多於子目之下更敷暢其義唯八政五紀五福六極但列其子目而不復更有所論說故宋人以為有錯簡移庶徵王省惟嵗至則以風雨繫厯數之下移皇極斂時五福至其作汝用咎繫考終命之下移三德惟辟作福至民用僭忒繫六曰弱之下以是為得古經之正唯八政則更無可移遂以為元有闕文噫洪範至此幾割裂無完膚矣痛哉日知録云近有謂得朝鮮本尚書於洪範八政之末添多五十二字者按元王惲中堂事記中統二年髙麗世子植來朝宴於中書省問曰𫝊聞汝邦有古文尚書及海外異書答曰與中國不殊是知此五十二字者亦僞撰也蓋以八政有闕文即有補五十二字者出矣此宋人過疑經文之遺患也四五紀一曰嵗二曰月三曰日四曰星辰五曰厯數渭按厯史記作歷林氏曰前所言者先王所以厚民之政然政事之施不可不本於天時堯典咨汝羲暨和朞三百六旬有六日以閏月定四時成嵗允釐百工庶績咸熙是也一曰嵗者蘇氏謂嵗星所次是也嵗星日行千七百二十八分度之百四十五每嵗歷一辰十二嵗一周天者也二曰月者月行於天日十三度十九分度之七一月一周天者也三曰日者日之行於天日一度一嵗而一周天者也四曰星辰者嵗日月之所行也星者二十八宿東方角亢氐房心尾箕七十五度南方井鬼柳星張翼軫一百十二度西方奎婁胃昴畢觜參八十度北方斗牛女虛危室壁九十八度四分度之一是也辰者日月所㑹之次其次十有二正月㑹於娵訾二月㑹於降婁是也星辰之行與天左旋一日而一周一月而移一辰一嵗而復初者也五曰厯數者推數於厯以候日月星辰之行度而定時成嵗也嵗日月星辰四者其節各有盈縮進退遲速長短之不同故必以厯數而齊其行度然後各當其道而無所差舛於其間則百官皆得其職萬事各得其序而厚民之政於是而畢矣一曰嵗唯林氏從蘇𫝊作嵗星解為是黃度書說同孔疏云一曰嵗從冬至以及明年冬至為一嵗所以紀四時也二曰月從朔至晦大月三十日小月二十九日所以紀一月也三曰日從夜半以至明日夜半周十二辰為一日所以紀一日也以嵗為一朞以月為三十日以日為十二時則即是推步之所成侵下厯數部位矣蓋嵗月日星辰四者皆在天之象嵗嵗星月太隂日太陽乃七政之三皆右旋而有進退遲速之不同者也星辰則二十八宿分為十二次皆經星之與天為體而為嵗月日之所躔者也唯林氏得其解薛士龍云星五星也辰經星也蔡傳云嵗者序四時也月者定晦朔也日者正躔度也星經星緯星也並謬國語伶州鳩對景王曰昔武王伐殷嵗在鶉火日在析木之津月在天駟辰在斗柄星在天黿漢律厯志釋此文曰武王克殷以箕子歸十三年也自文王受命而至此十三年嵗亦在鶉火故𫝊曰嵗在鶉火師初發以殷十一月戊子日在析木箕七度故𫝊曰日在析木是夕也月在房五度房為天駟故𫝊曰月在天駟後三日得周正月辛卯朔合辰在斗前一度斗柄也故𫝊曰辰在斗柄明日壬辰䢅星始見師古曰䢅古辰字也其字從臼臼音居玉反癸巳武王始發丙午巡師戊午度于孟津明日己未冬至䢅星與婺女伏歷建星及牽牛至于婺女天黿之首故𫝊曰星在天黿此述劉歆三統厯也韋昭注國語曰嵗嵗星也從栁九度至張十七度為鶉火謂武王始發師東行時嵗星在張十三度天駟房星也謂戊子日月宿房五度津天漢也從尾十度至斗十一度為析木其間為漢津謂戊子日日宿箕七度辰日月之㑹謂周正月辛卯朔於殷為十二月夏為十一月是日月合辰斗前一度星辰星也天黿次名一曰𤣥枵從須女八度至危十五度為天黿謂周正月二日壬辰辰星始見三日癸巳武王發行二十八日戊午度孟津距戊子三十一日二十九日己未晦冬至辰星在須女伏天黿之首也今按劉歆韋昭於千嵗之下以厯術推伶州鳩之言無一不吻合真所謂可坐而致東坡以一曰嵗為嵗星亦從此得來其下文州鳩所稱五位即嵗月日辰星也先辰後星與洪範小異者何蓋辰在斗柄之辰字己該二十八宿五紀之四者備矣而星在天黿專指五緯之辰星嵗星日行十二分度之一十二嵗而周天辰星日行一度一嵗而周天故首言嵗終言辰月令季冬之月口窮于次月窮于紀星回于天謂日月與辰星俱㑹于𤣥枵也辰水星天黿水位以其為顓頊之所建姬氏之自出也特舉而言之别是一義故星次辰之後宋儒據此遂以五紀星辰之中兼有緯星則誤矣然則堯典之所謂日月星辰與洪範同乎否乎曰同日月星即七政也辰則二十八星分十二次為七政之所舍者也洪範於五緯獨言嵗星以其餘無關於定時成嵗也然嵗實緯星舉一可以槩其餘故曰同也周禮馮相氏掌十有二嵗鄭注云嵗謂太嵗嵗星與日同次之月斗所建之辰樂說說嵗星與日常應太嵗月建以見然則今厯太嵗非此也王氏詳說曰在天有嵗星在地有太嵗嵗星右行太嵗左行在斗曰星紀在女曰𤣥枵在危曰娵訾在奎曰降婁在胃曰大梁在畢曰實沈在井曰鶉首在栁曰鶉火在軫曰鶉尾在氐曰壽星在心曰大火在箕曰析木此所謂嵗星右行在寅曰攝提格在卯曰單閼在辰曰執徐在巳曰大荒落在午曰敦牂在未曰協洽在申曰涒灘在酉曰作噩在戌曰掩茂在亥曰大淵獻在子曰困敦在丑曰赤奮若此所謂太嵗左行左行者謂自東而南自南而西自西而北右行者謂自北而西自西而南自南而東至於日月之行猶是也天道左旋而經星從之日體右轉而嵗星從之故日行北陸為冬西陸為春南陸為夏東陸為秋然嵗星在天一嵗行一辰率百四十四嵗而跳一辰若再跳則厯又改矣春秋保乾圖曰三百年斗厯改憲者以此朱子語録曰天道與日月五星皆是左旋天道日一周天而常過一度日一日一周天起度端終度端故比天道常不及一度月行不及天十三度有竒今人却云日行遲月行速此錯說也但厯家以右旋為說取其易見日月之度爾又曰如何見得三百六十五度甚麼人去量來只是天行得過處為度天之過處便是日之退處又曰進數為順天而左退數為逆天而右厯家以進數難算只以退數算之故謂之右行且曰日行遲月行疾此乃截法其實非右行也橫渠云天左旋處其中者順之少遲則反右矣此說最好按橫渠說本隋書厯志董氏鼎曰朱子云天無體二十八宿便是體二十八宿之行即天行也是以謂之經星猶機絲之有經一定而不動而日月五星緯乎其中所以分晝夜而列四時無非順天而成造化也故自地面而觀其運行則皆東升西沒繞地而左旋自天度而考其次舍則日月五星獨以漸而東為逆天而右轉蓋由其行不及天而次舍日以退然舍雖退而行未嘗不進也退雖逆而進未嘗不順也於天雖逆而右轉於地則未嘗不順而左旋也蔡傳說堯典咨汝羲暨和節曰天體至圓周圍三百六十五度四分度之一繞地左旋常一日一周而過一度日麗天而少遲故日行一日亦繞地一周而在天為不及一度積三百六十五日九百四十分日之二百三十五而與天㑹是一嵗日行之數也月麗天而尤遲一日常不及天十三度十九分度之七積二十九日九百四十分日之四百九十七七當作九而與日㑹十二㑹得全日三百四十八餘分之積又五千九百八十八如日法九百四十而一得六不盡三百四十八通計得日三百五十四九百四十分日之二百當作三百四十八是一嵗月行之數也嵗有十二月月有三十日三百六十者一嵗之常數也故日與天㑹而多五日九百四十分日之二百三十五者為氣盈月與日㑹而少五日九百四十分日之五百九十二者為朔虛合氣盈朔虛而閏生焉故一嵗閏率則十日九百四十分日之八百二十七三嵗一閏則三十二日九百四十分日之六百單一五嵗再閏則五十四日九百四十分日之三百七十五十有九嵗七閏則氣朔分齊是為一章也故三年而不置閏則春之一月入於夏而時漸不定矣子之一月入於丑而嵗漸不成矣積之之久至於三失閏則春皆入夏而時全不定矣十二失閏子皆入丑嵗全不成矣其名實乖戾寒暑反易農桑庶務皆失其時故必以此餘日置閏月於其間然後四時不差而嵗功得成也閻氏若璩尚書古文疏證曰蔡𫝊余不病其言理而病其言數厯尤數之大者帝曰咨汝羲暨和一節純用朱子訂𫝊既非堯厯亦非宋厯蓋從孔穎達疏採來儘亦明析然猶未若授時時憲二厯之精密也余因以二厯之理與數補注堯典其辭曰論其理天周之度嵗周之日皆三百六十有五而又有餘分自今嵗冬至距來嵗冬至為一朞歷三百六十五日而日行一周凡四周積千四百六十則餘一日析而四之則四分之一也經言有六日者舉其成數也自正月朔日至十二月晦日為一嵗得三百五十四日而十二晦朔終焉朱子云合氣盈朔虛而閏生蓋一嵗有二十四氣假如一月約計三十日則宜十五日交一節氣矣然朞三百六十五日零二十五刻分配二十四氣則不止於三百六十故必十五日零二時五刻為一節三十日零五時二刻為兩節所謂氣盈也月之合朔二十九日半則月不能為三十日之數積十二月三百六十日計之內虛五日零六時三刻是為朔虛故每嵗常六箇月小止得三百五十四日也氣盈於三百六十日之外有五日零三時朔虛於三百六十日之內有五日零六時三刻則一嵗之間大約多出十日零八時三嵗則多出三十二日有竒所以置閏也三嵗而一閏即以閏月計之亦不須三十二日有竒故置閏之法其先則三年一閏者三繼以兩年一閏者一續又三年一閏者二繼又兩年一閏者一如是經七閏然後氣朔分齊是為一章也論其數天周三百六十五度二十五分七十五秒嵗周三百六十五日二十四刻二十五分而日與天㑹月一日不及天一十三度三十六分八十七秒五十微積二十九日五十三刻五分九十三秒而月與日會十二㑹通計得日三百五十四日三十六刻七十一分一十六秒是一嵗月行之數日與天㑹而多五日二十四刻二十五分為氣盈月與日㑹而少五日六十三刻二十八分八十四秒為朔虛合氣盈朔虛共得十日八十七刻五十三分八十四秒為一嵗閏率三嵗一閏則三十二日六十二刻六十一分五十二秒五嵗再閏則五十四日三十七刻六十九分二十秒十有九嵗七閏則二百六日六十三刻二十二分九十六秒蓋不用積年日法而以實測得之豈不較勝於訂傳之本正義者哉吳氏亨夀曰嵗無定日閏有定法朞閏嵗三字為此一節之大要朞者一嵗之足日也嵗者一嵗之省日也閏者補三嵗之省日湊為三嵗之足日也數言明潔了當可作古注讀五紀專為八政而設說五紀而忘却八政即非經㫖今試就八政之協於五紀者言之七月之首章曰三之日于耜四之日舉趾同我婦子饁彼南𤱔其七章曰九月築場圃十月納禾稼晝爾于茅宵爾索綯亟其乘屋其始播百穀國語虢文公曰古者大史順時瓜見土陽疸憤盈土氣震發農祥晨正農祥房星也日月底於天廟天廟營室也土乃脉發先時九日大史告稷曰自今至於初吉初吉二月朔日也陽氣俱蒸土膏其動弗震弗渝脉其滿眚穀乃不殖稷以告王曰史帥陽官以命我司事曰距今九日土其俱動王其祗祓監農不易月令季夏之月土潤溽暑大雨時行燒剃行水利以殺草如以熱湯可以糞田疇可以美土疆孟冬之月命有司循行積聚無有不斂仲冬之月農有不收藏積聚者取之不詰此食政也七月之三章曰八月載績載𤣥載黃我朱孔陽為公子裳漢食貨志冬民既入婦人同巷相從夜績女工一月得四十五日月令仲秋之月易關市來商旅納貨賄以便民事此貨政也詩傳春曰祠夏曰禴秋曰嘗冬曰蒸月令春祀戶夏祀竈季夏祀中􅋼秋祀門冬祀行郊特牲嵗十二月蠟合聚萬物而索饗之又黃衣黃冠而祭以息田夫周禮籥章中春晝擊土鼓吹豳詩以逆暑中秋夜迎寒亦如之此祀政也月令孟春之月命司空曰時雨將降下水上騰循行國邑周視原野修利隄防道達溝瀆開通道路毋有障塞命工師令百工審五庫之量金鐵皮革筋角齒羽箭幹脂膠丹漆毋或不良百工咸理監工日號毋悖于時毋或作為淫巧以蕩上心考工記弓人凡為弓冬析幹而春液角夏治筋而秋合三材寒奠體氷析灂左傳凡土功龍見而戒事火見而致用水昏正而栽日至而畢國語先王之教曰雨畢而除道水涸而成梁九月雨畢十月水涸清風至而修城郭宫室謂火見之後建亥之初此司空之政也周禮鄉大夫正月之吉受教法于司徒退而頒之于其鄉吏三年則大比考其德行道藝而興賢者能者以禮禮賓之州長正月之吉各屬其州之民而讀法若以嵗時祭祀州社亦如之春秋以禮㑹民而射於州序黨正及四時之孟月吉日則屬民而讀邦法春秋祭禜亦如之國索鬼神而祭祀則以禮屬民而飲酒于序以正齒位此司徒之政也孟秋之月鷹乃祭鳥用始行戮命有司修法制繕囹圄具桎梏禁止姦慎罪邪務搏執審斷決獄訟必端平戮有罪嚴斷刑仲秋之月命有司申嚴百刑斬殺必當毋或枉橈枉橈不當反受其殃季秋之月乃趣獄刑毋留有罪周禮布憲掌憲邦之刑禁正月之吉執旌節以宣布于四方此司寇之政也中春之月媒氏令㑹男女有賓焉士昏禮云主人如賓服迎于門外是也嵗十二月國索鬼神而祭祀州長以禮屬民而飲酒于序有賓焉禮運云仲尼與於蠟賓是也此賓政也春搜夏苗秋獮冬狩皆於農隙以講事三年而治兵入而振旅歸而飲至以數軍實此師政也聖人取法天地因時以出政凡此類見於經傳者不可勝數而秦火之後載籍淪亡其無所考者尚多也聊舉一隅用資三反觀堯命羲和之辭知古之所以推步日月星辰者為治厯故也其所以汲汲於治厯者以敬授人時允釐百工故也洪範八政之下次以五紀先之以嵗月日星辰而終之以厯數正與堯典意同夏小正豳風七月及吕氏月令因物候以紀人功察中星而視斗柄雖去古稍逺要不失此意惟周官有馮相保章二職以占候為事頗涉乎妖祥降及春秋梓慎裨竈之流以十二分野日月五星躔離之度占歷國之吉凶蓋其說滋多於是矣洎乎戰國臯唐甘石之書流播於人間大抵皆禨祥禍福之說漢承其弊分天文厯法為二科京房翊奉諸人以占候之術自鳴於時妖祥之驗寖多而授時之令廢矣宣城梅文鼎定九精於推步深得堯典之㫖嘗著天文論以闢分野星占之謬嵗己巳與余相見於京師晨夕過從論此義甚悉然可為知者道難與俗人言也疇之切於皇極者莫如五事而經顧次皇極於八政五紀之後者何也修己治人無二理也中庸曰能盡其性則能盡人之性能盡人之性則能盡物之性又曰誠者非自成己而已也所以成物也茍不能成物則其所以成己者亦有所未至故五事既修必因時以立政使萬物各得其所而後皇極可建也洪範正論卷三
