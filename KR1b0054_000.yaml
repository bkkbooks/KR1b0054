body:
  text: 洪範正論書類提要臣等謹案洪範正論五卷國朝胡渭撰渭有禹貢錐指已著録此書大㫖以禹之治水本於九疇故首言鯀堙洪水繼言禹乃嗣興終言天乃錫禹則洪範為體而禹貢為用互相推闡其義乃彰然大㫖主於發明奉若天道之理非鄭樵禹貢洪範相為表裏之說惟以九州次序分配五行者比也其辨證前人之說如謂漢人專取灾祥推衍五行穿鑿附㑹事同讖緯其病一洛書本文即五行五事至五福六極十二字惟敬用農用十八字為禹所加與危微精一之心法同㫖初一次二至次九不過是次第名色亦非龜文所有龜之有文如木石之文又如魯夫人公子友有文在手之類宋儒創為黑白之㸃方圓之體九十之位變書而為圖以至九數十數劉牧蔡季通紛紜更定其病二又洪範原無錯簡而王柏胡一桂等任意改竄其病三皆切中舊說之失蓋渭經術湛深學問有根柢故所論一軌於理漢儒附㑹之談宋儒變亂之論能一掃而廓清之云乾隆四十四年八月恭校上總纂官臣紀昀臣陸錫熊臣孫士毅總校官臣陸費墀原序洪範一書如日月之麗天有目者所共覩而問有晦肓否塞者則先儒之曲說為之害也五事本於五行庶徴本於五事不過以雨𤾉燠寒風之時不時驗貌言視聽思之敬不敬而漢儒五行傳專主災異其所言貌之不恭厥極惡等事固已乖矣而又推廣言之曰妖曰孽曰禍曰痾曰眚曰沴復援春秋及漢事以實之以瞽史矯誣之說亂彛倫攸叙之經害一也洛書之本文具在洪範劉歆之言非妄而宋儒乃創為白黑之點方圖之體九十之位則書也而變為圖矣且謂範之理可通於易故劉牧易數鉤𨼆以九位為河圖十位為洛書而蔡元定兩易其名害二也洪範元無錯簡而宋儒任意改竄移庶徴王省惟嵗以下為五紀之傳移皇極斂時五福至其作汝用咎及三德惟辟作福以下並為五福六極之傳害三矣愚為是解非敢撥棄舊詁而逞吾臆見也去其不正者以就其正者而聖人之意得矣自甲申迄己丑芟繁補闕辨誤析疑纂成五卷名之曰洪範正論德清胡渭
